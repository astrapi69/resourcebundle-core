# The values ResourceBundleExtensionsApostropheTest reads (#21). Each one holds what MessageFormat
# treats specially: a single apostrophe, a quoted word, a doubled apostrophe (MessageFormat's escape
# for one) and a parameter pattern.
single=don't
quoted=a 'word' here
doubled=don''t
pattern=Hello {0}
quoted.parameter=''{0}'' already exists
doubled.with.parameter=don''t {0}
